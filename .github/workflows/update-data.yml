name: Weekly Data Update

on:
  schedule:
    # Run on the first day of every month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install project dependencies
        run: just install

      - name: Create data directory
        run: mkdir -p data

      - name: Run full data pipeline (dlt -> dbt -> export)
        run: just data

      - name: Install prek
        run: uv tool install prek

      - name: Run prek format on all files
        run: uv run prek run --all-files || true

      - name: Configure git as GitHub Actions bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated files
        run: |
          git add --all
          git diff --cached --quiet || git commit -m "chore(data): data update - $(date -u +%Y-%m-%d)"

      - name: Push changes
        run: git push origin main || true
